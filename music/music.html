<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riff Jukebox</title>
    <link rel="stylesheet" href="music.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bgmain">

    <header class="musicheader">
        <div class="logo">
            <h2>Riff Jukebox</h2>
        </div>

        <div class="back">
            <a href="../index.html"><i data-lucide="arrow-left"></i></a>
        </div>
    </header>
    <div class="main">
        <!---sidebar navigation-->
        <aside id="sidebar">
            <nav id="sidebarnav">
                <button class="navbutton active" data-tab="catalog"><i
                        data-lucide="home"></i><span>Dashboard</span></button>
                <button class="navbutton" data-tab="library"><i data-lucide="library"></i><span>Library</span></button>
                <button class="navbutton" data-tab="history"><i data-lucide="clock-3"></i><span>History</span></button>
                <button class="navbutton" data-tab="like"><i data-lucide="heart"></i><span>Liked Songs</span></button>
            </nav>

            <div id="sidebardivider"></div>

            <div id="queuepart">
                <div id="queueheader">
                    <span>Upcoming Queue</span>
                    <span id="queuecount">0 items</span>
                </div>
                <div id="queuelist">
                    <!--music stored in frontend will fetch using javascript-->
                </div>
            </div>
        </aside>

        <!--dashboard-->
        <main id="dashboard">
            <h2 id="title">Dashboard</h2>

            <div id="musicgrid">
                <!--this also fetch using javascript-->
            </div>
        </main>
    </div>

    <!--music controls-->
    <footer id="player" class="hiddenplayer">
        <audio id="audio"></audio>
        <input type="range" id="seekbar" values="0" min="0" max="100">

        <!--music details (metadata)-->
        <div id="playermetadata">
            <div id="thumbnail">
                <img id="cover" src="" alt="">
                <div id="dot"></div>
            </div>
            <div id="metadatatext">
                <h4 id="playertitle">Trach Idle</h4>
                <p id="playerartist">Select a song above</p>
            </div>
            <button id="likebutton" title="Like this Song"><i data-lucide="heart"></i></button>
            <button id="savebutton" title="Add to Library"><i data-lucide="plus"></i></button>
        </div>

        <div id="controls">
            <button id="previousbutton"><i data-lucide="skip-back"></i></button>
            <button id="playbutton"><i data-lucide="play"></i></button>
            <button id="nextbutton"><i data-lucide="skip-forward"></i></button>
            <span id="currenttime">0:00</span> / <span id="totaltime">0:00</span>
        </div>

        <div id="volumepart">
            <i data-lucide="volume-2"></i>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="1">

        </div>

    </footer>

    <script src="music.js"></script>
    <script src="songs.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
